<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Ponnoy Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .login-box{max-width:420px;width:100%;}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:999px;padding:13px;font-weight:700;width:100%;}
  .gbtn:hover{box-shadow:var(--shadow);}
  .divider{display:flex;align-items:center;gap:10px;color:var(--text-soft);font-size:13px;margin:22px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .tab-row{display:flex;gap:6px;background:var(--cream-soft);border-radius:999px;padding:4px;margin-bottom:24px;}
  .tab-row button{flex:1;padding:9px;border:none;background:none;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--text-soft);}
  .tab-row button.active{background:var(--bg-card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08);}
</style>
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="dot"></span>Ponnoy <span class="serif" style="color:var(--marigold-dark)">Bazar</span></a>
    <div style="flex:1"></div>
    <div class="nav-actions">
      <button class="icon-btn" data-theme-toggle title="Toggle theme"><span data-theme-icon></span></button>
    </div>
  </div>
</header>

<div class="login-wrap">
  <div class="login-box">
    <div class="form-card">
      <div class="tab-row">
        <button class="active" data-tab="customer">Customer</button>
        <button data-tab="admin">Admin</button>
      </div>

      <div id="tab-customer">
        <h3 class="serif" style="margin-top:0;text-align:center;">Welcome back</h3>
        <p style="text-align:center;color:var(--text-soft);font-size:14px;margin-bottom:24px;">Sign in to track orders and checkout faster.</p>
        <button class="gbtn" id="google-login">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C33.9 5.1 29.2 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C33.9 5.1 29.2 3 24 3c-7.6 0-14.2 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.1 0 9.8-2 13.2-5.2l-6.1-5.2c-2 1.4-4.5 2.2-7.1 2.2-5.3 0-9.6-3.4-11.3-8L6 33.5C9.5 40.7 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.1 5.2C40.9 35.9 45 30.5 45 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <div class="divider">or</div>
        <a href="https://wa.me/8801328397540?text=Hi%2C%20I%20want%20to%20place%20an%20order" target="_blank" class="btn btn-coral btn-block">💬 Order via WhatsApp instead</a>
        <p id="login-status" style="text-align:center;font-size:13px;color:var(--text-soft);margin-top:18px;"></p>
      </div>

      <div id="tab-admin" style="display:none;">
        <h3 class="serif" style="margin-top:0;text-align:center;">Admin Login</h3>
        <p style="text-align:center;color:var(--text-soft);font-size:13.5px;margin-bottom:20px;">Demo credentials: <b>admin@ponnoybazar.com</b> / <b>admin123</b></p>
        <form id="admin-login-form">
          <div class="field"><label>Email</label><input type="email" name="email" placeholder="admin@ponnoybazar.com" required></div>
          <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
          <button type="submit" class="btn btn-dark btn-block">Sign in to Admin Panel</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.querySelectorAll('.tab-row button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-row button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-customer').style.display = btn.dataset.tab==='customer' ? 'block' : 'none';
      document.getElementById('tab-admin').style.display = btn.dataset.tab==='admin' ? 'block' : 'none';
    });
  });

  document.getElementById('google-login').addEventListener('click', ()=>{
    const user = PB.auth.loginWithGoogle();
    document.getElementById('login-status').textContent = `Signed in as ${user.name} (${user.email})`;
    PB.toast('Signed in with Google', 'success');
    setTimeout(()=> window.location.href = 'products.html', 900);
  });

  document.getElementById('admin-login-form').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const user = PB.auth.loginAdmin(fd.get('email'), fd.get('password'));
    if(user){
      PB.toast('Welcome back, Admin', 'success');
      setTimeout(()=> window.location.href = 'admin.html', 600);
    } else {
      PB.toast('Invalid admin credentials', 'error');
    }
  });
</script>
</body>
</html>
